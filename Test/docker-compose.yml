version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Dspring.datasource.url=jdbc:sqlite:auth.db
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    container_name: auth-backend
    restart: unless-stopped

  frontend:
    image: httpserver:1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    container_name: auth-frontend
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  maven-cache:
