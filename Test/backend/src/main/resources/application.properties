# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=auth-system

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:auth.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# JPA/Hibernate Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false

# SQL Data Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=your-secret-key-change-in-production-please-use-a-strong-key-with-at-least-32-characters
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.auth=DEBUG

# CORS Configuration is handled in the controller with @CrossOrigin
