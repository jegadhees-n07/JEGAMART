<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - JD Mart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="navbar">
        <a href="/" class="brand-logo">
          <div class="logo-badge">JD</div>
          <div>
            <div class="logo-text">MART</div>
            <span class="logo-sub">Shopping Simplified</span>
          </div>
        </a>

        <div class="search-container">
          <form class="search-form" id="navSearchForm">
            <input type="text" class="search-input" id="navSearchInput" placeholder="Search for products, categories..." autocomplete="off">
            <button type="submit" class="search-btn"><span>🔍</span></button>
          </form>
        </div>

        <div class="nav-actions">
          <div id="navUserActions" style="display:flex; align-items:center; gap:0.75rem;"></div>
          <a href="/cart.html" class="cart-btn">
            <span>🛒</span>
            <span>Cart</span>
            <span class="cart-badge" id="navCartBadge">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="cartMainContainer">
      <div class="empty-state">
        <p>Loading your shopping cart...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© 2026 JD Mart Inc. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
