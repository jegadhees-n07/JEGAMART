<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - JD Mart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="navbar">
        <a href="/" class="brand-logo">
          <div class="logo-badge">JD</div>
          <div>
            <div class="logo-text">MART</div>
            <span class="logo-sub">Shopping Simplified</span>
          </div>
        </a>

        <div class="search-container">
          <form class="search-form" id="navSearchForm">
            <input type="text" class="search-input" id="navSearchInput" placeholder="Search for products, categories..." autocomplete="off">
            <button type="submit" class="search-btn"><span>🔍</span></button>
          </form>
        </div>

        <div class="nav-actions">
          <div id="navUserActions" style="display:flex; align-items:center; gap:0.75rem;"></div>
          <a href="/cart.html" class="cart-btn">
            <span>🛒</span>
            <span>Cart</span>
            <span class="cart-badge" id="navCartBadge">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 1.5rem; max-width: 900px;">
    <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem;">Account Overview</h1>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
      <!-- Edit Profile -->
      <div class="cart-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid #e2e8f0;">
          <h2 style="font-size: 1.15rem; font-weight: 700;">Personal Information</h2>
          <div id="profileRoles"></div>
        </div>

        <form id="editProfileForm">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="profileFullName" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address (Read-only)</label>
            <input type="email" id="profileEmail" class="form-control" disabled style="background:#f1f5f9;">
          </div>
          <div class="form-group">
            <label class="form-label">Mobile Number</label>
            <input type="tel" id="profileMobile" class="form-control" maxlength="10" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
        </form>
      </div>

      <!-- Change Password -->
      <div class="cart-card">
        <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #e2e8f0;">
          Security & Password
        </h2>
        <form id="changePasswordForm">
          <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" id="currentPassword" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" id="newPassword" class="form-control" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" class="form-control" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-outline btn-block">Update Password</button>
        </form>
      </div>
    </div>

    <!-- Saved Addresses -->
    <div class="cart-card" style="margin-top: 1.5rem;">
      <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #e2e8f0;">
        Saved Delivery Addresses
      </h2>
      <div id="savedAddressesList">
        <p>Loading addresses...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© 2026 JD Mart Inc. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
