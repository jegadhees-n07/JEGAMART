<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products - JD Mart Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-admin-page="products">

  <!-- Admin Header -->
  <header class="site-header" style="background:#0f172a; border-bottom:1px solid #1e293b;">
    <div class="container">
      <div class="navbar">
        <a href="/admin-dashboard.html" class="brand-logo" style="color:#ffffff;">
          <div class="logo-badge" style="background:var(--secondary);">JD</div>
          <span style="color:#ffffff;">MART <span style="font-size:0.8rem; color:#94a3b8; font-weight:400;">ADMIN</span></span>
        </a>

        <div style="display:flex; gap:1.25rem; align-items:center;">
          <a href="/admin-dashboard.html" style="color:#94a3b8; font-weight:600; font-size:0.9rem;">Dashboard</a>
          <a href="/admin-products.html" style="color:#ffffff; font-weight:700; font-size:0.9rem;">Products</a>
          <a href="/admin-orders.html" style="color:#94a3b8; font-weight:600; font-size:0.9rem;">Orders</a>
          <a href="/" style="color:#38bdf8; font-weight:600; font-size:0.9rem;">View Storefront ↗</a>
          <button onclick="Auth.logout()" class="btn btn-outline" style="padding:0.35rem 0.75rem; font-size:0.8rem; background:transparent; color:#ffffff; border-color:#334155;">
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
      <div>
        <h1 style="font-size: 1.6rem; font-weight: 800;">Product Management</h1>
        <p style="color:#64748b; font-size:0.875rem;">Manage catalog listings, prices, discounts, and inventory</p>
      </div>
      <div>
        <button class="btn btn-primary" onclick="openAddProductModal()">
          <span>+</span> Add New Product
        </button>
      </div>
    </div>

    <!-- Products Table -->
    <div class="cart-card">
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Product Details</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminProductsTableBody">
            <tr><td colspan="7" style="text-align:center;">Loading products...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Product Create / Edit Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="productModalTitle" style="font-size:1.25rem; font-weight:800;">Add Product</h2>
        <button class="modal-close-btn" onclick="closeProductModal()">✕</button>
      </div>

      <form id="adminProductForm">
        <input type="hidden" id="editProdId">

        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input type="text" id="prodName" class="form-control" placeholder="e.g. Samsung Galaxy M35 5G" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select id="prodCategorySelect" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Original Price (₹) *</label>
            <input type="number" step="0.01" id="prodOriginalPrice" class="form-control" placeholder="e.g. 19999" required min="1">
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Discount Percentage (%)</label>
            <input type="number" id="prodDiscountPct" class="form-control" placeholder="0-100" min="0" max="99" value="0">
          </div>
          <div class="form-group">
            <label class="form-label">Stock Quantity *</label>
            <input type="number" id="prodStock" class="form-control" placeholder="e.g. 50" min="0" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Product Image URL</label>
          <input type="url" id="prodImageUrl" class="form-control" placeholder="https://images.unsplash.com/photo-...">
        </div>

        <div class="form-group">
          <label class="form-label">Short Description</label>
          <input type="text" id="prodShortDesc" class="form-control" placeholder="Brief summary highlighted on cards">
        </div>

        <div class="form-group">
          <label class="form-label">Detailed Description</label>
          <textarea id="prodDesc" class="form-control" rows="3" placeholder="Full product details and benefits"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Specifications (Format: Label: Value | Label: Value)</label>
          <input type="text" id="prodSpecs" class="form-control" placeholder="RAM: 8GB | Storage: 128GB | Battery: 5000mAh">
        </div>

        <div style="display:flex; gap:1.5rem; margin-bottom:1.5rem;">
          <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
            <input type="checkbox" id="prodFeatured">
            <span style="font-size:0.875rem; font-weight:600;">Featured on Home</span>
          </label>
          <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
            <input type="checkbox" id="prodTrending">
            <span style="font-size:0.875rem; font-weight:600;">Trending Product</span>
          </label>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:0.75rem;">
          <button type="button" class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
