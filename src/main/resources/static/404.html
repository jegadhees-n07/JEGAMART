<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | JD Mart</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="navbar">
        <a href="/" class="brand-logo">
          <div class="logo-badge">JD</div>
          <div><div class="logo-text">MART</div></div>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
    <div class="empty-state" style="border: none; max-width: 500px;">
      <div style="font-size: 5rem; font-weight: 900; color: var(--primary); line-height: 1;">404</div>
      <h2 style="font-size: 1.5rem; font-weight: 800; margin: 1rem 0 0.5rem;">Oops! Page Not Found</h2>
      <p style="color: #64748b; margin-bottom: 1.5rem;">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
      <a href="/" class="btn btn-primary" style="padding: 0.75rem 2rem;">Back to Home</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© 2026 JD Mart Inc. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
