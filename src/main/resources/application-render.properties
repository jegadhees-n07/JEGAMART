# Render fallback profile. Use MySQL by setting SPRING_PROFILES_ACTIVE and
# DB_URL, DB_USERNAME, and DB_PASSWORD to a reachable database.
spring.datasource.url=jdbc:h2:mem:jdmart;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
