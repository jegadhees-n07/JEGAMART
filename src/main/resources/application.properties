# ==========================================
# JD Mart - Application Properties
# ==========================================
spring.application.name=jd-mart
server.port=${PORT:8080}

# Database Configuration
# Configure DB_URL, DB_USERNAME, and DB_PASSWORD for a persistent MySQL database.
# H2 keeps the application runnable when no external database is configured.
spring.datasource.url=${DB_URL:jdbc:h2:mem:jdmart;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Security
app.jwt.secret=${JWT_SECRET:JDMartSuperSecretKeyForJWTAuthentication2026SecureKeyWithSufficientEntropy512Bit}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
